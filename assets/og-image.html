<!doctype html>
<!-- Source for assets/og-image.png (the link-preview card). Open at 1200x630 and screenshot to regenerate. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ESG Country Panel &mdash; preview card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600;700&family=Fira+Sans:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 84px; background: #0d0d0d; color: #fff; font-family: "Fira Sans", sans-serif; position: relative; overflow: hidden; }
  body::before { content: ""; position: absolute; right: -120px; top: -160px; width: 620px; height: 620px; background: radial-gradient(circle, rgba(57,135,229,.30), transparent 65%); }
  body::after { content: ""; position: absolute; left: -160px; bottom: -220px; width: 620px; height: 620px; background: radial-gradient(circle, rgba(25,158,112,.28), transparent 65%); }
  .kicker { position: relative; z-index: 1; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: #c3c2b7; }
  h1 { position: relative; z-index: 1; font-family: "EB Garamond", Garamond, serif; font-weight: 700; font-size: 84px; line-height: 1.04; margin: 28px 0 0; max-width: 1040px; white-space: nowrap; }
  .sub { position: relative; z-index: 1; margin-top: 30px; font-size: 30px; color: #c3c2b7; max-width: 800px; line-height: 1.35; }
  .bars { position: absolute; z-index: 1; right: 96px; bottom: 84px; display: flex; gap: 20px; align-items: flex-end; }
  .bars i { display: block; width: 44px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="kicker">ESG Country Panel</div>
  <h1>Two decades of E, S, and G</h1>
  <div class="sub">World Bank data on 217 countries, 2002&ndash;2023: nine findings and an interactive dashboard.</div>
  <div class="bars"><i style="height:110px;background:#199e70"></i><i style="height:170px;background:#3987e5"></i><i style="height:220px;background:#9085e9"></i></div>
</body>
</html>
